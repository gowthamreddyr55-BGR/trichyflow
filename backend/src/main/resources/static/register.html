<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRICHYFLOW — Citizen & Official Registration | Trichy Traffic</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body.register-page {
      background: radial-gradient(circle at 10% 20%, rgba(255, 153, 51, 0.22) 0%, transparent 45%),
                  radial-gradient(circle at 90% 85%, rgba(19, 136, 8, 0.22) 0%, transparent 45%),
                  linear-gradient(135deg, #050C1A 0%, #0A1122 50%, #060E1E 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    .register-box {
      width: 100%;
      max-width: 580px;
      background: rgba(13, 27, 54, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 2.25rem;
      position: relative;
      z-index: 10;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .tricolour-top-border {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      border-radius: 18px 18px 0 0;
      background: linear-gradient(90deg, #FF9933 0%, #FF9933 33%, #FFFFFF 33%, #FFFFFF 66%, #138808 66%, #138808 100%);
    }

    .background-chakra {
      position: fixed;
      width: 600px;
      height: 600px;
      opacity: 0.04;
      pointer-events: none;
      z-index: 0;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .form-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 0.35rem;
    }

    .form-control-trichy {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      border-radius: 8px;
      padding: 0.65rem 0.95rem;
      font-size: 0.9rem;
      width: 100%;
      transition: all 0.2s ease;
    }

    .form-control-trichy:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: #FF9933;
      outline: none;
      box-shadow: 0 0 0 3px rgba(255, 153, 51, 0.25);
      color: #FFFFFF;
    }
  </style>
</head>
<body class="register-page">

  <!-- Rotating Ashoka Chakra Background -->
  <div class="background-chakra animate-chakra">
    <img src="assets/images/ashoka_chakra.svg" alt="Ashoka Chakra" style="width: 100%; height: 100%;">
  </div>

  <div class="register-box">
    <div class="tricolour-top-border"></div>

    <div class="text-center mb-4">
      <div style="font-size: 2.2rem; color: var(--saffron);">
        <i class="fa-solid fa-id-card"></i>
      </div>
      <h2 style="font-weight: 900; letter-spacing: 0.06em; margin: 4px 0 0; background: linear-gradient(90deg, #FF9933 0%, #FFFFFF 50%, #138808 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
        TRICHYFLOW
      </h2>
      <div style="font-size: 0.8rem; letter-spacing: 0.08em; color: #9CA3AF; text-transform: uppercase;">
        Create New User Account (Public & Official)
      </div>
      <div class="mt-1" style="font-size: 0.72rem; color: #64748B;">
        Trichy City Traffic Operations & Citizen Services Platform
      </div>
    </div>

    <!-- Feedback Message Container -->
    <div id="regFeedbackMsg" class="alert py-2 px-3 mb-3 text-center" style="display: none; font-size: 0.82rem;"></div>

    <form id="registerForm">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-user text-warning me-1"></i> Full Name</label>
          <input type="text" id="regFullName" class="form-control-trichy" placeholder="e.g. R. Karthik / M. Ramesh" required>
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-at text-info me-1"></i> Username</label>
          <input type="text" id="regUsername" class="form-control-trichy" placeholder="e.g. karthik_tn45" required>
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-id-badge text-success me-1"></i> Account Type / Role</label>
          <select id="regRole" class="form-control-trichy" onchange="toggleVehicleField(this.value)" required>
            <option value="PUBLIC" selected>Public Citizen / Motorist</option>
            <option value="TRAFFIC_POLICE">Traffic Police (Field Officer)</option>
            <option value="CONTROL_ROOM">Control Room Operator</option>
            <option value="ADMIN">System Administrator</option>
          </select>
        </div>

        <div class="col-md-6" id="vehicleGroup">
          <label class="form-label"><i class="fa fa-car text-warning me-1"></i> Vehicle Reg. No. (Optional)</label>
          <input type="text" id="regVehicleNo" class="form-control-trichy" placeholder="e.g. TN45AB1234">
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-envelope text-primary me-1"></i> Email Address</label>
          <input type="email" id="regEmail" class="form-control-trichy" placeholder="name@example.com">
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-phone text-success me-1"></i> Mobile Number</label>
          <input type="tel" id="regPhone" class="form-control-trichy" placeholder="+91 94431 XXXXX">
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-key text-warning me-1"></i> Password</label>
          <input type="password" id="regPassword" class="form-control-trichy" placeholder="Min 4 characters" required>
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="fa fa-lock text-warning me-1"></i> Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-control-trichy" placeholder="Re-enter password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-trichy w-100 justify-content-center py-2 mt-4" style="background: linear-gradient(135deg, #138808 0%, #15803d 100%); border: none; font-size: 0.95rem;">
        <i class="fa fa-user-check me-2"></i> Register Account
      </button>
    </form>

    <div class="text-center mt-3 pt-3 border-top border-secondary border-opacity-25" style="font-size: 0.82rem;">
      <span class="text-muted">Already have an account?</span>
      <a href="index.html" class="text-warning text-decoration-none fw-semibold ms-1">
        <i class="fa fa-sign-in-alt me-1"></i> Return to Login
      </a>
      <span class="text-muted mx-2">|</span>
      <a href="public-portal.html" class="text-info text-decoration-none">
        <i class="fa fa-users me-1"></i> Public Citizen Portal
      </a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function toggleVehicleField(role) {
      const vGroup = document.getElementById('vehicleGroup');
      if (role === 'PUBLIC') {
        vGroup.style.display = 'block';
      } else {
        vGroup.querySelector('label').innerHTML = `<i class="fa fa-shield-alt text-warning me-1"></i> Badge / Service ID`;
        vGroup.querySelector('input').placeholder = "e.g. TP-SRIR-99";
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      AuthManager.initRegister();
    });
  </script>
</body>
</html>
